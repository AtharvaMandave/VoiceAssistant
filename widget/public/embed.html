<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceFlow AI Widget</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #6366f1;
      --bg-primary: #0c0c12;
      --bg-secondary: #13131d;
      --bg-tertiary: #1a1a28;
      --surface-100: #f5f5f7;
      --surface-200: #e4e4e9;
      --surface-300: #b8b8c4;
      --surface-400: #8585a0;
      --surface-500: #5a5a78;
      --surface-600: #3d3d54;
      --surface-700: #2a2a3e;
      --surface-800: #1e1e2e;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--surface-200);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ───────────────────────────────────────────────────── */
    .widget-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--surface-700);
      flex-shrink: 0;
    }

    .widget-header .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand);
      color: white;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .widget-header .info {
      flex: 1;
    }

    .widget-header .name {
      font-weight: 600;
      font-size: 14px;
      color: var(--surface-100);
    }

    .widget-header .status {
      font-size: 11px;
      color: var(--surface-400);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .widget-header .status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    .widget-header .close-btn {
      background: none;
      border: none;
      color: var(--surface-400);
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      transition: all 0.15s;
    }
    .widget-header .close-btn:hover { background: var(--surface-700); color: var(--surface-200); }

    /* ─── Chat Body ────────────────────────────────────────────────── */
    .widget-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .widget-body::-webkit-scrollbar { width: 4px; }
    .widget-body::-webkit-scrollbar-track { background: transparent; }
    .widget-body::-webkit-scrollbar-thumb { background: var(--surface-600); border-radius: 4px; }

    .message {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      animation: msg-appear 0.25s ease;
    }

    .message.agent {
      background: var(--bg-tertiary);
      color: var(--surface-200);
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }

    .message.user {
      background: var(--brand);
      color: white;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: var(--surface-500);
      font-size: 11px;
      text-align: center;
      padding: 4px 8px;
    }

    @keyframes msg-appear {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Thinking indicator */
    .thinking {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }

    .thinking span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--surface-500);
      animation: bounce 1.4s ease-in-out infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.16s; }
    .thinking span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ─── Voice Control ────────────────────────────────────────────── */
    .widget-footer {
      padding: 14px 18px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--surface-700);
      flex-shrink: 0;
    }

    .voice-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .text-input {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--surface-700);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--surface-200);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .text-input:focus { border-color: var(--brand); }
    .text-input::placeholder { color: var(--surface-500); }

    .mic-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--brand);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .mic-btn:hover { transform: scale(1.06); filter: brightness(1.1); }
    .mic-btn.recording {
      background: #ef4444;
      animation: mic-pulse 1.2s ease-in-out infinite;
    }

    @keyframes mic-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--brand);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.06); filter: brightness(1.1); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ─── State Bar ────────────────────────────────────────────────── */
    .state-bar {
      text-align: center;
      padding: 6px;
      font-size: 11px;
      color: var(--surface-400);
      display: none;
    }

    .state-bar.active {
      display: block;
      animation: msg-appear 0.2s ease;
    }

    /* ─── Powered By ───────────────────────────────────────────────── */
    .powered-by {
      text-align: center;
      padding: 6px;
      font-size: 10px;
      color: var(--surface-500);
      background: var(--bg-primary);
      border-top: 1px solid var(--surface-700);
      flex-shrink: 0;
    }
    .powered-by a { color: var(--brand); text-decoration: none; }
    .powered-by a:hover { text-decoration: underline; }

    /* ─── Waveform Visualizer ──────────────────────────────────────── */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 24px;
      margin-top: 4px;
    }

    .waveform .bar {
      width: 3px;
      border-radius: 2px;
      background: var(--brand);
      animation: wave 1s ease-in-out infinite;
    }

    .waveform .bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .waveform .bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
    .waveform .bar:nth-child(3) { height: 12px; animation-delay: 0.2s; }
    .waveform .bar:nth-child(4) { height: 20px; animation-delay: 0.3s; }
    .waveform .bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1.2); }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <div class="widget-header" id="header">
    <div class="avatar" id="avatar">V</div>
    <div class="info">
      <div class="name" id="agentName">AI Assistant</div>
      <div class="status"><span class="dot"></span> Online</div>
    </div>
    <button class="close-btn" id="closeBtn" title="Minimize" aria-label="Minimize widget">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
  </div>

  <!-- Chat Body -->
  <div class="widget-body" id="chatBody"></div>

  <!-- State Bar -->
  <div class="state-bar" id="stateBar"></div>

  <!-- Footer -->
  <div class="widget-footer">
    <div class="voice-area">
      <input class="text-input" id="textInput" placeholder="Type a message…" autocomplete="off" />
      <button class="send-btn" id="sendBtn" title="Send" aria-label="Send message" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
      <button class="mic-btn" id="micBtn" title="Hold to speak" aria-label="Voice input">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="powered-by">Powered by <a href="#" target="_blank" rel="noopener">VoiceFlow AI</a></div>

  <script>
    // ─── Widget Iframe App ──────────────────────────────────────────
    const API_BASE = (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get("apiUrl")) return params.get("apiUrl");
      if (window.location.origin.includes("5173") || window.location.origin.includes("3000")) {
        return "http://localhost:3001";
      }
      return window.location.origin;
    })();

    const AGENT_ID = new URLSearchParams(window.location.search).get("agentId");

    // DOM references
    const chatBody = document.getElementById("chatBody");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const stateBar = document.getElementById("stateBar");
    const agentNameEl = document.getElementById("agentName");
    const avatarEl = document.getElementById("avatar");
    const closeBtn = document.getElementById("closeBtn");

    let sessionId = null;
    let conversationId = null;
    let ws = null;
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let agentConfig = null;

    // ─── Init ──────────────────────────────────────────────────────
    async function initWidget() {
      if (!AGENT_ID) {
        addMessage("system", "Widget configuration error: missing agent ID.");
        return;
      }

      // Create session
      try {
        const res = await fetch(`${API_BASE}/api/widget/session`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            agentId: AGENT_ID,
            pageUrl: window.parent?.location?.href || "",
            pageTitle: window.parent?.document?.title || "",
          }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          const msg = errData?.error?.message || `Error ${res.status}`;
          addMessage("system", `Unable to connect: ${msg}`);
          return;
        }

        const data = await res.json();
        const session = data.data || data;

        sessionId = session.sessionId;
        conversationId = session.conversationId;
        agentConfig = session.agentConfig;

        // Apply agent theme
        if (agentConfig) {
          agentNameEl.textContent = agentConfig.name || "AI Assistant";
          avatarEl.textContent = (agentConfig.name || "A").charAt(0).toUpperCase();

          if (agentConfig.widget?.primaryColor) {
            document.documentElement.style.setProperty("--brand", agentConfig.widget.primaryColor);
            avatarEl.style.background = agentConfig.widget.primaryColor;
          }

          if (agentConfig.widget?.welcomeMessage) {
            addMessage("agent", agentConfig.widget.welcomeMessage);
          }
        }

        // Connect WebSocket
        connectWebSocket();

      } catch (err) {
        console.error("[VoiceFlow Widget]", err);
        addMessage("system", "Connection failed. Please try again later.");
      }
    }

    // ─── WebSocket ─────────────────────────────────────────────────
    function connectWebSocket() {
      const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${wsProtocol}//${window.location.host}/ws/voice?sessionId=${sessionId}`;

      try {
        ws = new WebSocket(wsUrl);
      } catch {
        // WebSocket not available at this host — use REST fallback
        console.info("[VoiceFlow Widget] WebSocket not available, using text-only mode.");
        return;
      }

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "session.start",
          agentId: AGENT_ID,
          conversationId,
          sessionId,
          language: agentConfig?.voice?.language || "en-US",
          voice: agentConfig?.voice?.voiceId || "af_heart",
          sampleRate: 16000,
        }));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleServerEvent(msg);
        } catch { /* ignore non-JSON */ }
      };

      ws.onerror = () => {
        console.warn("[VoiceFlow Widget] WebSocket error");
      };

      ws.onclose = () => {
        console.info("[VoiceFlow Widget] WebSocket closed");
      };
    }

    function handleServerEvent(event) {
      switch (event.type) {
        case "speech.started":
          showState("Listening…");
          break;

        case "transcript.partial":
          showState(`Hearing: "${event.text}"`);
          break;

        case "transcript.final":
          addMessage("user", event.text);
          hideState();
          break;

        case "agent.thinking":
          showThinking();
          break;

        case "response.text.delta":
          appendAgentText(event.text);
          break;

        case "response.audio.chunk":
          playAudioChunk(event.audioBase64, event.format || "audio/wav");
          break;

        case "response.done":
          hideThinking();
          hideState();
          break;

        case "agent.interrupted":
          hideThinking();
          showState("Interrupted");
          setTimeout(hideState, 1500);
          break;

        case "error":
          addMessage("system", event.message || "An error occurred.");
          hideThinking();
          hideState();
          break;
      }
    }

    // ─── Text Messaging ────────────────────────────────────────────
    textInput.addEventListener("input", () => {
      sendBtn.disabled = !textInput.value.trim();
    });

    textInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendTextMessage();
      }
    });

    sendBtn.addEventListener("click", sendTextMessage);

    async function sendTextMessage() {
      const text = textInput.value.trim();
      if (!text) return;

      addMessage("user", text);
      textInput.value = "";
      sendBtn.disabled = true;
      showThinking();

      try {
        const res = await fetch(`${API_BASE}/api/widget/turn`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            agentId: AGENT_ID,
            conversationId,
            text,
            voice: agentConfig?.voice?.voiceId || "af_heart",
            speed: agentConfig?.voice?.speed || 1.0,
            language: agentConfig?.voice?.language || "en-US",
          }),
        });

        hideThinking();

        if (res.ok) {
          const data = await res.json();
          const turn = data.data || data;

          if (turn.conversationId) conversationId = turn.conversationId;

          if (turn.responseText) {
            addMessage("agent", turn.responseText);
          }

          if (turn.audioBase64 && turn.audioFormat) {
            playAudioChunk(turn.audioBase64, turn.audioFormat);
          }
        } else {
          const errData = await res.json().catch(() => ({}));
          const errMsg = errData?.error?.message || "Sorry, I couldn't process that. Please try again.";
          addMessage("system", errMsg);
        }
      } catch (err) {
        hideThinking();
        addMessage("system", "Connection error. Please try again.");
      }
    }

    // ─── Voice Recording ───────────────────────────────────────────
    micBtn.addEventListener("mousedown", startRecording);
    micBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
    micBtn.addEventListener("mouseup", stopRecording);
    micBtn.addEventListener("mouseleave", stopRecording);
    micBtn.addEventListener("touchend", stopRecording);

    async function startRecording() {
      if (isRecording) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const supportedMimeType = window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
          ? "audio/webm;codecs=opus"
          : window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm")
          ? "audio/webm"
          : window.MediaRecorder && MediaRecorder.isTypeSupported("audio/mp4")
          ? "audio/mp4"
          : "";

        mediaRecorder = supportedMimeType ? new MediaRecorder(stream, { mimeType: supportedMimeType }) : new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach((t) => t.stop());
          const recordedType = mediaRecorder.mimeType || "audio/webm";
          const audioBlob = new Blob(audioChunks, { type: recordedType });
          await sendAudio(audioBlob, recordedType);
        };

        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add("recording");
        showState("🎙 Listening…");
      } catch (err) {
        addMessage("system", "Microphone access denied. Please allow microphone permission in your browser.");
      }
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove("recording");
      hideState();
    }

    async function sendAudio(blob, recordedMimeType) {
      showThinking();

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result.split(",")[1];

        // If WebSocket is open and connected, send audio via WS
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "audio.chunk",
            data: base64,
            seq: Date.now(),
          }));
          ws.send(JSON.stringify({ type: "speech.ended" }));
          return;
        }

        // Otherwise, use REST widget turn endpoint
        try {
          const res = await fetch(`${API_BASE}/api/widget/turn`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              agentId: AGENT_ID,
              conversationId,
              audioBase64: base64,
              mimeType: recordedMimeType || "audio/webm",
              voice: agentConfig?.voice?.voiceId || "af_heart",
              speed: agentConfig?.voice?.speed || 1.0,
              language: agentConfig?.voice?.language || "en-US",
            }),
          });

          hideThinking();
          if (res.ok) {
            const data = await res.json();
            const turn = data.data || data;

            if (turn.conversationId) conversationId = turn.conversationId;
            if (turn.transcribedText) addMessage("user", turn.transcribedText);
            if (turn.responseText) addMessage("agent", turn.responseText);
            if (turn.audioBase64 && turn.audioFormat) {
              playAudioChunk(turn.audioBase64, turn.audioFormat);
            }
          } else {
            const errData = await res.json().catch(() => ({}));
            const errMsg = errData?.error?.message || "Voice processing failed. Try typing your question.";
            addMessage("system", errMsg);
          }
        } catch (err) {
          hideThinking();
          addMessage("system", "Connection error.");
        }
      };
      reader.readAsDataURL(blob);
    }

    // ─── Audio Playback ────────────────────────────────────────────
    function playAudioChunk(base64, format) {
      try {
        const audio = new Audio(`data:${format};base64,${base64}`);
        audio.play().catch(() => {});
      } catch { /* silently fail */ }
    }

    // ─── UI Helpers ────────────────────────────────────────────────
    let currentAgentBubble = null;

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;

      if (role === "agent") {
        currentAgentBubble = div;
      } else {
        currentAgentBubble = null;
      }
    }

    function appendAgentText(text) {
      if (!currentAgentBubble) {
        addMessage("agent", text);
      } else {
        currentAgentBubble.textContent += text;
        chatBody.scrollTop = chatBody.scrollHeight;
      }
    }

    function showThinking() {
      const existing = document.querySelector(".thinking");
      if (existing) return;

      const div = document.createElement("div");
      div.className = "message agent thinking";
      div.innerHTML = "<span></span><span></span><span></span>";
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function hideThinking() {
      const el = document.querySelector(".thinking");
      if (el) el.remove();
    }

    function showState(text) {
      stateBar.textContent = text;
      stateBar.classList.add("active");
    }

    function hideState() {
      stateBar.classList.remove("active");
    }

    // ─── Close Button ──────────────────────────────────────────────
    closeBtn.addEventListener("click", () => {
      window.parent.postMessage({ type: "voiceflow:close-widget" }, "*");
    });

    // ─── Listen for parent messages ────────────────────────────────
    window.addEventListener("message", (event) => {
      if (event.data?.type === "voiceflow:widget-opened") {
        // Widget became visible — auto-focus input
        textInput.focus();
      }
    });

    // ─── Bootstrap ─────────────────────────────────────────────────
    initWidget();
  </script>
</body>
</html>
